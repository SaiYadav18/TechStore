<!DOCTYPE html>
<html>
<head>

<title>Product Details</title>

<style>

body{

font-family:Arial;

background:#f2f2f2;

margin:0;

}

.container{

width:700px;

margin:50px auto;

background:white;

padding:30px;

border-radius:10px;

box-shadow:0px 0px 10px gray;

}

h1{

color:#0d6efd;

}

button{

padding:12px 25px;

background:#0d6efd;

color:white;

border:none;

cursor:pointer;

font-size:18px;

border-radius:5px;

}

button:hover{

background:#084298;

}

img{

width:300px;

display:block;

margin:auto;

}

</style>

</head>

<body>

<div class="container">

<h1>Product Details</h1>

<img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=600">

<h2 id="name"></h2>

<h3 id="price"></h3>

<p>

This is one of our premium products.

✔ High Quality

✔ One Year Warranty

✔ Fast Delivery

✔ 7 Days Replacement

</p>

<button onclick="checkout()">

Proceed to Checkout

</button>

</div>

<script>

document.getElementById("name").innerHTML=
localStorage.getItem("productName");

document.getElementById("price").innerHTML=
localStorage.getItem("productPrice");

function checkout(){

window.location="checkout.html";

}

</script>

</body>
</html>
