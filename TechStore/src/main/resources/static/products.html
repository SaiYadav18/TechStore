<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechStore | Products</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6f9;
}

/* Navbar */
header{
    background:#0d6efd;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 50px;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

nav a:hover{
    color:yellow;
}

/* Welcome */
.banner{
    text-align:center;
    padding:40px;
    background:white;
}

.banner h1{
    color:#0d6efd;
    margin-bottom:10px;
}

/* Products */
.container{
    width:90%;
    margin:auto;
    padding:40px 0;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:20px;
}

.card-body h3{
    margin-bottom:10px;
}

.price{
    color:#28a745;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#084298;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}
</style>

</head>
<body>

<header>

<div class="logo">TechStore</div>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
    <a href="login.html">Logout</a>
</nav>

</header>

<section class="banner">
<h1>Welcome to TechStore</h1>
<p>Select your favorite product.</p>
</section>

<div class="container">

<div class="products" id="products">





</div>

</div>

<footer>
<p>© 2026 TechStore | All Rights Reserved</p>
</footer>

<script>

async function loadProducts(){

    const response = await fetch("/api/products");

    const products = await response.json();

    let html = "";

    products.forEach(product=>{

        html += `

        <div class="card">

            <img src="${product.imageUrl}">

            <div class="card-body">

                <h3>${product.productName}</h3>

                <p>${product.description}</p>

                <div class="price">$${product.price}</div>

                <button onclick="buy(${product.id})">

                    Buy Now

                </button>

            </div>

        </div>

        `;

    });

    document.getElementById("products").innerHTML = html;

}

loadProducts();

function buy(id){

    window.location="product-details.html?id="+id;

}

</script>

</body>
</html>
