<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechStore | Products</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


/* Pagination */
#pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin:50px 0;
    flex-wrap:wrap;
}

#pagination button{

    min-width:45px;
    height:45px;

    border:1px solid #ddd;
    border-radius:10px;

    background:white;
    color:#333;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    padding:0 15px;
}

/* Hover */
#pagination button:hover{

    background:#0d6efd;
    color:white;
    border-color:#0d6efd;

}

/* Active Page */
#pagination button.active{

    background:#dc3545;
    color:white;
    border:none;

}

/* Previous / Next */
#pagination button.nav-btn{

    color:#777;
    background:#fff;
    border:1px solid #ddd;
    min-width:100px;

}

#pagination button.nav-btn:hover{

    background:#0d6efd;
    color:white;

}

#pagination button:disabled{

    opacity:.5;
    cursor:not-allowed;

}

body{
    background:#f4f6f9;
}

/* Navbar */
header{
    background:#0d6efd;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 50px;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

nav a:hover{
    color:yellow;
}

/* Welcome */
.banner{
    text-align:center;
    padding:40px;
    background:white;
}

.banner h1{
    color:#0d6efd;
    margin-bottom:10px;
}

/* Products */
.container{
    width:90%;
    margin:auto;
    padding:40px 0;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:20px;
}

.card-body h3{
    margin-bottom:10px;
}

.price{
    color:#28a745;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.card button{

    width:100%;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;

}

.card button:hover{

    background:#084298;

}


footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}

#pagination button.active{
    background:#dc3545;
    color:white;
}

#pagination .nav-btn{
    min-width:110px;
}
</style>

</head>
<body>

<header>

<div class="logo">TechStore</div>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="add-product.html">Add Product</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
    <a href="login.html">Logout</a>
</nav>

</header>

<section class="banner">
<h1>Welcome to TechStore</h1>
<p>Select your favorite product.</p>
</section>

<div class="container">

<div class="products" id="products">

</div>

</div>

<div id="pagination" style="text-align:center;margin:30px;"></div>

<footer>
<p>© 2026 TechStore | All Rights Reserved</p>
</footer>

<script>

let currentPage = 0;
const pageSize = 4;

async function loadProducts(page = 0) {

    currentPage = page;

    const response = await fetch(`/api/products?page=${page}&size=${pageSize}`);

    const data = await response.json();

    let html = "";

    data.content.forEach(product => {

        html += `

        <div class="card">

            <img src="/uploads/${product.imageUrl}">

            <div class="card-body">

                <h3>${product.productName}</h3>

                <p>${product.description}</p>

                <div class="price">$${product.price}</div>

                <button onclick="buy(${product.id})">

                    Buy Now

                </button>

            </div>

        </div>

        `;

    });

    document.getElementById("products").innerHTML = html;

    renderPagination(data.totalPages);

}

function renderPagination(totalPages){

    let html = "";

    // Previous Button
    html += `
        <button
            class="nav-btn"
            ${currentPage==0 ? "disabled" : ""}
            onclick="loadProducts(${currentPage-1})">
            ❮ Previous
        </button>
    `;

    // Page Numbers
    for(let i=0;i<totalPages;i++){

        html += `
            <button
                class="${i===currentPage ? 'active' : ''}"
                onclick="loadProducts(${i})">
                ${i+1}
            </button>
        `;

    }

    // Next Button
    html += `
        <button
            class="nav-btn"
            ${currentPage==totalPages-1 ? "disabled" : ""}
            onclick="loadProducts(${currentPage+1})">
            Next ❯
        </button>
    `;

    document.getElementById("pagination").innerHTML = html;

}

loadProducts();

function buy(id){

    window.location = "product-details.html?id=" + id;

}

</script>

</body>
</html>
